[build]
  command = "npm --prefix frontend run build"
  publish = "frontend/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[dev]
  framework = "vite"
  targetPort = 5173
  port = 8888

# 🔁 Redirect old Netlify subdomain to custom domain
[[redirects]]
  from = "https://profound-figolla-72e059.netlify.app/*"
  to = "https://www.happyfuntimesnacks.com/:splat"
  status = 301
  force = true

# ✅ Serve sitemap.xml as a static file
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

# 🔁 Catch-all fallback for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

