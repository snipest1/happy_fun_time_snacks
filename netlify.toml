[[redirects]]
  from = "https://profound-figolla-72e059.netlify.app/*"
  to = "https://www.happyfuntimesnacks.com/:splat"
  status = 301
  force = true

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[dev]
  framework = "vite"
  targetPort = 5173
  port = 8888

# 🔁 Canonical domain redirect
[[redirects]]
  from = "https://happyfuntimesnacks.netlify.app/*"
  to = "https://www.happyfuntimesnacks.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
